name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres and apply schema
        run: |
          until pg_isready -h localhost -p 5432; do sleep 1; done
          PGPASSWORD=postgres psql -h localhost -U postgres -d banking_db_test -f schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d banking_db_test -f migrations/002_loans.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d banking_db_test -f migrations/003_two_factor.sql

      - name: Create .env.test
        run: |
          cat <<EOF > .env.test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/banking_db_test
          JWT_SECRET=test_secret_key_do_not_use_in_prod
          JWT_EXPIRES_IN=1h
          PORT=5001
          EOF

      - name: Run tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_SOCKET_URL: http://localhost:5000
